server:
  port: 8443  # порт встроенного Tomcat для будущих REST endpoints
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE:file:certs/server-keystore.p12}
    key-store-type: PKCS12
    key-store-password:  ${TLS_KEYSTORE_PASSWORD:}
    key-password: ${TLS_KEY_PASSWORD:${TLS_KEYSTORE_PASSWORD:}}
    key-alias: server
    enabled-protocols: TLSv1.2,TLSv1.3
chat:
  tcp-port: ${CHAT_TLS_PORT:5000}  # порт нашего TCP-чата
  tcp-enabled: true # ChatServerStarter не создаётся в тестах
  tls:
    key-store: ${TLS_KEYSTORE:file:certs/server-keystore.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:}
    key-password: ${TLS_KEY_PASSWORD:${TLS_KEYSTORE_PASSWORD:}}

auth:
  provider: local
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long}
    expiration-minutes: 60

spring:
  autoconfigure:
    exclude:
      #- org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      #- org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      #- org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/secure_chat
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rate-limit:
  register:
    capacity: 5
    period-minutes: 60
  login:
    capacity: 10
    period-minutes: 60